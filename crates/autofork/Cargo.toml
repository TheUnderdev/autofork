[package]
name = "autofork"
description = "autofork CLI: Claude Code hook entrypoint and daemon control"
keywords = ["autofork", "claude-code", "opencode", "agents", "cli"]
categories = ["development-tools", "command-line-utilities"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "autofork"
path = "src/main.rs"

[dependencies]
autofork-core.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# The daemon endpoint is a named pipe on Windows; tokio is the one client
# for those with timeouts (a blocking std::fs::File on a pipe has none).
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
