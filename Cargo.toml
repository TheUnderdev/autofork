[workspace]
resolver = "2"
members = ["crates/autofork-core", "crates/autofork-daemon", "crates/autofork"]

[workspace.package]
version = "0.27.2"
edition = "2021"
license = "MIT"
authors = ["TheUnderdev <me@theunder.dev>"]
repository = "https://github.com/TheUnderdev/autofork"

[workspace.dependencies]
autofork-core = { version = "0.27.2", path = "crates/autofork-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
getrandom = "0.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
